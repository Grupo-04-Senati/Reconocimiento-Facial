apiVersion: apps/v1
kind: Deployment
metadata:
  name: facial-recognition-backend
  labels:
    app: facial-recognition
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: facial-recognition
      tier: backend
  template:
    metadata:
      labels:
        app: facial-recognition
        tier: backend
    spec:
      containers:
        - name: backend
          image: facial-recognition-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: facial-recognition-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facial-recognition-frontend
  labels:
    app: facial-recognition
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: facial-recognition
      tier: frontend
  template:
    metadata:
      labels:
        app: facial-recognition
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: facial-recognition-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
