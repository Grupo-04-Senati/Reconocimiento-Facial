[project]
name = "reconocimiento-facial"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",
    "supabase>=2.9.1",
    "insightface>=0.7.3",
    "onnxruntime>=1.19.2",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.26.4,<2.0",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.2",
    "joblib>=1.4.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.2",
]

[tool.vercel]
entrypoint = "backend.api.index:app"
