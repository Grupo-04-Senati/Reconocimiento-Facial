services:
  - type: web
    name: reconocimiento-facial-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: face-images
      - key: SUPABASE_MODELS_BUCKET
        value: face-models
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UMBRAL_SIMILITUD
        value: "0.40"
      - key: UMBRAL_LIVENESS
        value: "0.85"
      - key: CORS_ORIGINS
        value: "https://reconocimiento-facial-xi.vercel.app"
      - key: LOG_LEVEL
        value: INFO
